<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My First Azure Web App</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #eef5ff; color: #172c48; font-family: system-ui, sans-serif; }
      main { width: 100%; max-width: 660px; padding: clamp(24px, 6vw, 56px); background: white; border: 1px solid #dce7f7; border-radius: 24px; box-shadow: 0 20px 60px #163c7210; }
      .badge { display: inline-block; padding: 7px 12px; border-radius: 30px; background: #e7f1ff; color: #075cba; font-size: 14px; font-weight: 650; }
      h1 { font-size: clamp(32px, 6vw, 48px); line-height: 1.12; letter-spacing: -1.5px; margin: 24px 0 16px; }
      p { color: #52657e; line-height: 1.7; }
      button { margin-top: 16px; padding: 13px 22px; border: 0; border-radius: 10px; background: #0866ce; color: white; font: inherit; font-weight: 650; cursor: pointer; }
      button:hover { background: #004eaa; }
      button:focus-visible, a:focus-visible { outline: 3px solid #172c48; outline-offset: 4px; }
      #message { min-height: 28px; }
      footer { margin-top: 30px; border-top: 1px solid #e5ebf3; padding-top: 20px; font-size: 14px; color: #52657e; }
      a { color: #075cba; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">My cloud learning project</span>
      <h1>Hello from my first web app!</h1>
      <p>A small app. A first step into the cloud. Deploy this page to Azure App Service and visit it from anywhere.</p>
      <button id="hello" type="button">Say hello</button>
      <p id="message" role="status" aria-live="polite">Your app is up and running.</p>
      <footer>Built with Node.js &middot; <a href="/health">Check app health</a></footer>
    </main>
    <script>
      let clicks = 0;
      document.getElementById('hello').addEventListener('click', () => {
        clicks += 1;
        document.getElementById('message').textContent = `Hello! You clicked ${clicks} ${clicks === 1 ? 'time' : 'times'}.`;
      });
    </script>
  </body>
</html>
